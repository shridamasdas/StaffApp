<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Attendance</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0E5E6F; color: #fff;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
  .box { padding: 24px; max-width: 320px; }
  .spin { width: 40px; height: 40px; margin: 0 auto 16px; border: 4px solid rgba(255,255,255,.3);
          border-top-color: #F2A900; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  button { margin-top: 16px; padding: 12px 24px; font-size: 17px; font-weight: 700; border: 0;
           border-radius: 12px; background: #F2A900; color: #08414D; }
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><div>Loading…</div></div>
<script>
  /* Loads the latest app screens from Apps Script, so changes there show up without a new APK.
     The last loaded version is kept on the phone and used when the internet is slow or off. */
  const CACHE = 'staff_ui_html';
  const cfg = JSON.parse(AndroidApp.config());

  function start(html) {
    document.open();
    document.write(html);
    document.close();
  }
  function fail(msg) {
    document.getElementById('box').innerHTML = '<div>' + msg + '</div><button onclick="location.reload()">Try again</button>';
  }
  let cached = null;
  try { cached = localStorage.getItem(CACHE); } catch (e) {}

  const timer = setTimeout(() => { if (cached) { const c = cached; cached = null; start(c); } }, 8000);

  fetch(cfg.apiUrl, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ role: 'staff', fn: 'getStaffUi', args: [] })
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) throw new Error(d.error);
    try { localStorage.setItem(CACHE, d.data); } catch (e) {}
    clearTimeout(timer);
    if (document.getElementById('box')) start(d.data);
  })
  .catch(e => {
    clearTimeout(timer);
    if (!document.getElementById('box')) return;
    if (cached) start(cached);
    else fail(/fetch|network/i.test(e.message) ? 'No internet connection.' : e.message);
  });
</script>
</body>
</html>
